<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Control Panel | Admin Dashboard</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="user.css">

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-custom sticky-top px-4 py-3">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <!-- Left: Back Icon (Text Removed, Icon Only) -->
      <a href="admin.html" class="back-icon-btn" title="Back to Admin Panel">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <!-- Middle: Live Sync Indicator -->
      <div id="liveSyncIndicator" class="live-sync-badge online mx-auto">
        <div class="live-sync-dots">
          <span class="dot dot-1"></span>
          <span class="dot dot-2"></span>
          <span class="dot dot-3"></span>
        </div>
        <span class="sync-text">Live Sync Active</span>
      </div>

      <!-- Right: Logout Icon -->
      <button id="logoutBtn" class="logout-icon-btn" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <div class="container py-4">

    <!-- Header Section -->
    <div class="glass-card p-4 mb-4">
      <div class="row align-items-center g-3">
        <div class="col-auto">
          <div class="user-avatar-lg">
            <i class="fa-solid fa-user text-white"></i>
          </div>
        </div>
        <div class="col">
          <h3 class="m-0 fw-bold text-white" id="displayUserName">Loading...</h3>
          <p class="text-white m-0" style="color: #ffffff !important;">User ID: <span class="badge bg-primary fs-6 ms-1" id="displayUserId">----</span></p>
        </div>
        <div class="col-md-auto ms-auto">
          <label class="info-label d-block mb-1">Account Status</label>
          <select id="userStatusSelect" class="form-select form-select-custom fw-bold">
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
            <option value="blocked">Blocked</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Details Grid -->
    <div class="row g-4">
      <!-- Personal Information Card -->
      <div class="col-lg-6">
        <div class="glass-card p-4 h-100">
          <h5 class="fw-bold mb-4 text-primary"><i class="fa-solid fa-id-card me-2"></i>Personal Information</h5>
          
          <div class="row g-3">
            <div class="col-6">
              <span class="info-label">NID Number</span>
              <div class="info-value" id="infoNid">N/A</div>
            </div>
            <div class="col-6">
              <span class="info-label">Email Address</span>
              <div class="info-value" id="infoEmail">N/A</div>
            </div>
            <div class="col-6">
              <span class="info-label">Phone Number</span>
              <div class="info-value" id="infoPhone">N/A</div>
            </div>
            <div class="col-6">
              <span class="info-label">Gender</span>
              <div class="info-value" id="infoGender">N/A</div>
            </div>
            <div class="col-6">
              <span class="info-label">Date of Birth</span>
              <div class="info-value" id="infoDob">N/A</div>
            </div>
            <div class="col-6">
              <span class="info-label">Blood Group</span>
              <div class="info-value" id="infoBlood">N/A</div>
            </div>
            <div class="col-12">
              <span class="info-label">Address</span>
              <div class="info-value" id="infoAddress">
                <div style="margin-bottom: 6px;"><strong style="color: #94a3b8; font-size: 12px; display: block; letter-spacing: 0.5px;">PRESENT ADDRESS</strong><span style="color: #ffffff; font-size: 15px;" id="infoPresentAddress">N/A</span></div>
                <div><strong style="color: #94a3b8; font-size: 12px; display: block; letter-spacing: 0.5px; margin-top: 8px;">PERMANENT ADDRESS</strong><span style="color: #ffffff; font-size: 15px;" id="infoPermanentAddress">N/A</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Security & Danger Zone Card -->
      <div class="col-lg-6">
        <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
          <div>
            <h5 class="fw-bold mb-4 text-warning"><i class="fa-solid fa-shield-halved me-2"></i>Security & Password Control</h5>
            
            <div class="mb-3">
              <label class="info-label mb-1">Current Password</label>
              <input type="text" id="currentPasswordInput" class="form-control form-control-custom" readonly>
            </div>

            <div class="mb-3">
              <label class="info-label mb-1">Set New Password</label>
              <input type="text" id="newPasswordInput" class="form-control form-control-custom" placeholder="Enter new password">
            </div>

            <button id="updatePasswordBtn" class="btn btn-gradient-blue w-100 mb-4">
              <i class="fa-solid fa-key me-2"></i>Update Password
            </button>
          </div>

          <div class="border-top border-secondary pt-3">
            <h6 class="text-danger fw-bold"><i class="fa-solid fa-triangle-exclamation me-1"></i>DANGER ZONE</h6>
            <button id="deleteAccountBtn" class="btn btn-gradient-danger w-100 mt-2">
              <i class="fa-solid fa-trash me-2"></i>Delete User Account Permanently
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- User Vault Records Section -->
    <div class="glass-card p-4 mt-4">
      <h5 class="fw-bold mb-4 text-info"><i class="fa-solid fa-vault me-2"></i>User Vault Records</h5>
      <!-- id="userVaultContainer" যুক্ত করা হয়েছে যাতে js ফাইল থেকে সরাসরি ভল্ট কার্ডগুলো রেন্ডার হতে পারে -->
      <div class="row g-3" id="userVaultContainer">
        <!-- Vault cards will be loaded here dynamically -->
      </div>
    </div>

  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.5npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Custom JavaScript -->
  <script src="user.js"></script>
</body>
</html>

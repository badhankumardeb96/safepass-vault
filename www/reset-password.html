<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePass Vault - Reset Password</title>
    <!-- Tailwind CSS CDN for styling matching your project -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-white mb-2 text-center">Reset Password</h2>
        <p class="text-slate-400 text-sm mb-6 text-center">Enter your new secure password below.</p>

        <form id="resetPasswordForm" class="space-y-4">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">New Password</label>
                <input type="password" id="newPassword" required placeholder="Enter new password" 
                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required placeholder="Re-enter new password" 
                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" id="updateBtn" 
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition duration-200">
                Update Password
            </button>
        </form>

        <div id="messageBox" class="mt-4 text-center text-sm hidden"></div>
    </div>

    <!-- Supabase Configuration & Reset Handler Script -->
    <script>
        // Supabase Configuration (আপনার প্রজেক্টের সঠিক URL এবং Anon Key)
        const SUPABASE_URL = "https://vgjsoicsmmzahhsuworg.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_NkMibVnz7Vt6CAHuSTaQZw_zpUFGNsv";

        let supabaseClient = null;
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const form = document.getElementById("resetPasswordForm");
            const messageBox = document.getElementById("messageBox");
            const updateBtn = document.getElementById("updateBtn");

            // URL হ্যাস বা কোয়েরি থেকে Supabase এর রিকভারী টোকেন এক্সচেঞ্জ করে সেশন সেটআপ করা
            const hash = window.location.hash;
            if (hash && hash.includes('type=recovery')) {
                // Supabase v2 স্বয়ংক্রিয়ভাবে URL হ্যাস থেকে টোকেন প্রসেস করে নেয় যখন ক্লায়েন্ট লোড হয়
                console.log("Recovery token detected in URL hash.");
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const newPassword = document.getElementById("newPassword").value;
                const confirmPassword = document.getElementById("confirmNewPassword").value;

                messageBox.classList.remove("hidden", "text-green-400", "text-red-400");

                if (newPassword !== confirmPassword) {
                    messageBox.innerText = "Passwords do not match!";
                    messageBox.classList.add("text-red-400");
                    messageBox.classList.remove("hidden");
                    return;
                }

                if (newPassword.length < 6) {
                    messageBox.innerText = "Password must be at least 6 characters long.";
                    messageBox.classList.add("text-red-400");
                    messageBox.classList.remove("hidden");
                    return;
                }

                updateBtn.disabled = true;
                updateBtn.innerText = "Updating...";

                try {
                    if (!supabaseClient) throw new Error("Supabase client not initialized.");

                    // পাসওয়ার্ড আপডেট করার রিকোয়েস্ট পাঠানো
                    const { data, error } = await supabaseClient.auth.updateUser({
                        password: newPassword
                    });

                    if (error) throw error;

                    messageBox.innerText = "Password updated successfully! Redirecting to login...";
                    messageBox.classList.add("text-green-400");
                    messageBox.classList.remove("hidden");

                    setTimeout(() => {
                        window.location.href = "index.html"; // সফল হলে লগইন পেজে রিডাইরেক্ট করবে
                    }, 2500);

                } catch (err) {
                    console.error("Password update error:", err);
                    messageBox.innerText = "Error: " + err.message;
                    messageBox.classList.add("text-red-400");
                    messageBox.classList.remove("hidden");
                    updateBtn.disabled = false;
                    updateBtn.innerText = "Update Password";
                }
            });
        });
    </script>
</body>
</html>

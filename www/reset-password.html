<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafePass Vault - Reset Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);font-family:Arial,Helvetica,sans-serif;color:#fff;padding:20px}.card{width:min(440px,100%);background:#111827;border:1px solid #374151;border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.logo{width:64px;height:64px;border-radius:50%;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;background:#0ea5e9;color:#fff;font-size:28px}.title{text-align:center;margin:0 0 8px;font-size:25px}.subtitle{text-align:center;color:#94a3b8;margin:0 0 24px;line-height:1.5}.group{margin-bottom:16px}.group label{display:block;margin-bottom:7px;font-weight:700}.group input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;outline:none}.group input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.12)}button{width:100%;padding:13px;border:0;border-radius:8px;background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.message{display:none;margin-top:16px;padding:12px 14px;border-radius:8px;line-height:1.5;font-size:14px}.message.success{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#bbf7d0}.message.error{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fecaca}.status{text-align:center;color:#94a3b8;font-size:13px;margin-top:18px;min-height:18px}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><i class="fa-solid fa-key"></i></div>
    <h1 class="title">Reset Your Password</h1>
    <p class="subtitle">Enter a new password for your SafePass Vault account.</p>

    <form id="resetPasswordForm" novalidate>
      <div class="group">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Enter new password">
      </div>
      <div class="group">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Confirm new password">
      </div>
      <button id="resetPasswordBtn" type="submit"><i class="fa-solid fa-shield-halved"></i> Update Password</button>
    </form>

    <div id="message" class="message"></div>
    <div id="status" class="status">Checking secure recovery link...</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="reset-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Dashboard</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin-login.css">
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fa-solid fa-lock"></i>
                <h2>Admin Portal Login</h2>
                <p>Enter your Admin Email/Phone & Password</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Email or Phone Number *</label>
                    <input type="text" id="loginIdentifier" required placeholder="Enter registered admin email or phone">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-key"></i> Password *</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
                </button>
            </form>

            <!-- System Owner Create Account Button Section -->
            <div class="owner-action-section">
                <button id="openPinModalBtn" class="create-account-btn" type="button">
                    <i class="fa-solid fa-user-plus"></i> Create Account (Owner Only)
                </button>
            </div>

            <div class="login-footer">
                <p>Forgot password? Please <span class="contact-owner">contact system owner</span>.</p>
            </div>
        </div>
    </div>

    <!-- Secret PIN Modal for Account Creation -->
    <div id="pinModal" class="popup-overlay" style="display: none;">
        <div class="popup-box">
            <div class="pin-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3>System Owner Verification</h3>
            <p>Enter the secret PIN to access the registration panel:</p>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <input type="password" id="secretPinInput" placeholder="Enter Secret PIN" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; text-align: center; font-size: 1rem; width: 100%;">
            </div>

            <div class="pin-modal-buttons">
                <button id="verifyPinBtn" class="popup-btn" type="button" style="background: #27ae60;">Verify & Open</button>
                <button id="closePinModalBtn" class="popup-btn" type="button" style="background: #e74c3c;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Warning / Error Popup Modal -->
    <div id="warningPopup" class="popup-overlay" style="display: none;">
        <div class="popup-box">
            <div class="warning-icon-flash">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3>Access Denied!</h3>
            <p id="warningMessage">Account not found or you are not authorized as an admin.</p>
            <button id="popupCloseBtn" class="popup-btn" type="button" style="background: #c0392b;">OK</button>
        </div>
    </div>

    <!-- External Login JavaScript File -->
    <script src="admin-login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="SafePass Vault Admin Portal Login">
    <title>Login - Admin Dashboard</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin-login.css">

    <!--
        SafePass Vault / Supabase
        IMPORTANT: this is the public publishable/anon key only.
        Never put a Supabase service-role/secret key in this file.
    -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        (function () {
            'use strict';

            const SUPABASE_URL = 'https://vgjsoicsmmzahhsuworg.supabase.co';
            const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NkMibVnz7Vt6CAHuSTaQZw_zpUFGNsv';
            const AUTH_STORAGE_KEY = 'safepass-vault-auth';

            function createSafePassAdminSupabaseClient() {
                if (window.SafePassSupabaseClient) {
                    return window.SafePassSupabaseClient;
                }

                if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                    console.error('[SafePass] Supabase JS client was not loaded.');
                    return null;
                }

                const client = window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_PUBLISHABLE_KEY,
                    {
                        auth: {
                            persistSession: true,
                            autoRefreshToken: true,
                            detectSessionInUrl: true,
                            storage: window.localStorage,
                            storageKey: AUTH_STORAGE_KEY,
                            flowType: 'pkce'
                        },
                        global: {
                            headers: {
                                'x-client-info': 'safepass-vault-admin-web-mobile'
                            }
                        }
                    }
                );

                window.SafePassSupabaseClient = client;
                window.SafePassSupabaseConfig = {
                    url: SUPABASE_URL,
                    anonKey: SUPABASE_PUBLISHABLE_KEY,
                    storageKey: AUTH_STORAGE_KEY
                };

                return client;
            }

            function syncSupabaseSession(reason) {
                const client = createSafePassAdminSupabaseClient();
                if (!client || !client.auth) return;

                client.auth.getSession()
                    .then(function (result) {
                        if (result.error) {
                            console.warn('[SafePass] Session sync failed (' + reason + '):', result.error.message);
                            return;
                        }
                        window.SafePassAdminSession = result.data && result.data.session
                            ? result.data.session
                            : null;
                    })
                    .catch(function (error) {
                        console.warn('[SafePass] Session sync error (' + reason + '):', error);
                    });
            }

            // Shared client is available to admin-login.js and mobile/WebView wrappers.
            window.getSafePassSupabase = function () {
                return createSafePassAdminSupabaseClient();
            };

            // Create the client as soon as this page loads.
            createSafePassAdminSupabaseClient();

            // Mobile/WebView can temporarily lose network access. These hooks allow
            // the persisted Supabase session to refresh when connectivity returns.
            window.addEventListener('online', function () {
                syncSupabaseSession('online');
            });

            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                    syncSupabaseSession('visibility');
                }
            });

            window.addEventListener('pageshow', function () {
                syncSupabaseSession('pageshow');
            });
        })();
    </script>
</head>
<body>

    <main class="login-container" role="main">
        <section class="login-card" aria-labelledby="adminLoginTitle">
            <div class="login-header">
                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                <h1 id="adminLoginTitle">Admin Portal Login</h1>
                <p>Enter your Admin Email/Phone &amp; Password</p>
            </div>

            <form id="loginForm" class="login-form" novalidate autocomplete="on">
                <div class="form-group">
                    <label for="loginIdentifier">
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                        Email or Phone Number *
                    </label>
                    <input
                        type="text"
                        id="loginIdentifier"
                        name="loginIdentifier"
                        required
                        autocomplete="username"
                        inputmode="email"
                        autocapitalize="none"
                        spellcheck="false"
                        enterkeyhint="next"
                        placeholder="Enter registered admin email or phone"
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fa-solid fa-key" aria-hidden="true"></i>
                        Password *
                    </label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="loginPassword"
                        required
                        autocomplete="current-password"
                        autocapitalize="none"
                        spellcheck="false"
                        enterkeyhint="done"
                        placeholder="••••••••"
                    >
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                    Login to Dashboard
                </button>
            </form>

            <!-- System Owner Create Account Button Section -->
            <div class="owner-action-section">
                <button id="openPinModalBtn" class="create-account-btn" type="button">
                    <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                    Create Account (Owner Only)
                </button>
            </div>

            <div class="login-footer">
                <p>Forgot password? Please <span class="contact-owner">contact system owner</span>.</p>
            </div>
        </section>
    </main>

    <!-- Secret PIN Modal for Account Creation -->
    <div id="pinModal" class="popup-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="pinModalTitle">
        <div class="popup-box">
            <div class="pin-icon" aria-hidden="true">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 id="pinModalTitle">System Owner Verification</h2>
            <p>Enter the secret PIN to access the registration panel:</p>

            <div class="form-group" style="margin-bottom: 15px;">
                <label for="secretPinInput" class="sr-only">Secret PIN</label>
                <input
                    type="password"
                    id="secretPinInput"
                    name="secretPinInput"
                    autocomplete="off"
                    inputmode="numeric"
                    maxlength="64"
                    placeholder="Enter Secret PIN"
                    style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; text-align: center; font-size: 1rem; width: 100%; box-sizing: border-box;"
                >
            </div>

            <div class="pin-modal-buttons">
                <button id="verifyPinBtn" class="popup-btn" type="button" style="background: #27ae60;">
                    Verify &amp; Open
                </button>
                <button id="closePinModalBtn" class="popup-btn" type="button" style="background: #e74c3c;">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Warning / Error Popup Modal -->
    <div id="warningPopup" class="popup-overlay" style="display: none;" role="alertdialog" aria-modal="true" aria-labelledby="warningTitle" aria-describedby="warningMessage">
        <div class="popup-box">
            <div class="warning-icon-flash" aria-hidden="true">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 id="warningTitle">Access Denied!</h2>
            <p id="warningMessage">Account not found or you are not authorized as an admin.</p>
            <button id="popupCloseBtn" class="popup-btn" type="button" style="background: #c0392b;">
                OK
            </button>
        </div>
    </div>

    <!-- External Login JavaScript File -->
    <script src="admin-login.js" defer></script>

    <!-- Small accessibility helper; harmless if the custom CSS already defines it. -->
    <style>
        .sr-only {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        @media (max-width: 480px) {
            .login-container {
                min-height: 100dvh;
                padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
                box-sizing: border-box;
            }

            .login-card,
            .popup-box {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }

            input,
            button {
                min-height: 44px;
            }
        }
    </style>
</body>
</html>
